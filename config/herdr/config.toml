# herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[theme]
# catppuccin-macchiatoは組み込みに無いため、catppuccinをベースにMacchiatoの色へ寄せる
name = "catppuccin"

[theme.custom]
# Catppuccin Macchiato palette
accent = "#8aadf4"
red = "#ed8796"
green = "#a6da95"
blue = "#8aadf4"
yellow = "#eed49f"

[worktrees]
directory = "~/.herdr/worktrees"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[keys]
prefix = "ctrl+b"
# workspace選択時の上下移動をvim風のk/jに変更(デフォルトはup/down)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"
