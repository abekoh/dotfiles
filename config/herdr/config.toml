# herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[theme]
# catppuccin-macchiatoは組み込みに無いため、catppuccinをベースにMacchiatoの色へ寄せる
name = "catppuccin"

[theme.custom]
# Catppuccin Macchiato palette
accent = "#8aadf4"
red = "#ed8796"
green = "#a6da95"
blue = "#8aadf4"
yellow = "#eed49f"

[worktrees]
directory = "~/.herdr/worktrees"

[ui.toast]
delivery = "terminal"
